<div class="d-flex flex-column gap-4">
  <div class="d-flex justify-content-between align-items-start gap-3">
    <div>
      <h3>Personas</h3>
    </div>

    @if (projectId) {
      <button type="button" class="btn btn-primary" (click)="openCreatePersona()">
        <fa-icon [icon]="faPlus"></fa-icon>
        Add persona
      </button>
    }
  </div>

  @if (loading) {
    <div class="text-muted">Loading personas...</div>
  } @else if (personas.length > 0) {
    <div class="row row-cols-1 row-cols-xl-2 g-3">
      @for (item of personas; track item.persona.id) {
        <div class="col">
          <button
            type="button"
            class="card persona-card h-100 border-0 shadow-sm"
            (click)="openEditPersona(item.persona, $event)"
          >
            <div class="card-body d-flex flex-column gap-3">
              <div class="d-flex align-items-start gap-3 overflow-hidden">
                <span
                  class="rounded bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center p-2 flex-shrink-0"
                >
                  <fa-icon [icon]="entityIcons.persona"></fa-icon>
                </span>

                <div class="overflow-hidden">
                  <h5 class="card-title mb-1 text-truncate">{{ item.persona.name }}</h5>
                  <p class="card-text text-secondary mb-0 persona-description">
                    {{ item.persona.description }}
                  </p>
                </div>
              </div>

              <div class="d-flex flex-wrap gap-2 mt-auto">
                <span class="compact-stat">
                  <fa-icon class="text-primary" [icon]="entityCollectionIcons.scenarios"></fa-icon>
                  <span class="fw-semibold">{{ item.scenarioCount }}</span>
                  <span class="text-secondary">{{ scenarioLabel(item.scenarioCount) }}</span>
                </span>

                <span class="compact-stat">
                  <fa-icon class="text-primary" [icon]="entityIcons.userStory"></fa-icon>
                  <span class="fw-semibold">{{ item.userStoryCount }}</span>
                  <span class="text-secondary">{{ userStoryLabel(item.userStoryCount) }}</span>
                </span>
              </div>
            </div>
          </button>
        </div>
      }
    </div>
  } @else {
    <div class="border rounded p-4 text-secondary">No personas added yet.</div>
  }
</div>

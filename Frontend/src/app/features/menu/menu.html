@if (currentUser) {
  <aside class="p-0 bg-body-tertiary d-flex flex-column" style="height: 100%">
    <nav class="p-3">
      <div class="list-group list-group-flush">
        <a
          routerLink="/projects"
          routerLinkActive="active"
          class="list-group-item list-group-item-action bg-transparent cursor-pointer"
        >
          <fa-icon [icon]="faFolderOpen"></fa-icon>
          Projects
        </a>
      </div>
    </nav>

    <div class="p-3 border-top mt-auto user-menu">
      @if (userMenuOpen) {
        <div class="user-menu-dropdown">
          <button type="button" class="dropdown-item" (click)="logout()">
            <fa-icon [icon]="faRightFromBracket"></fa-icon>
            Logout
          </button>
        </div>
      }

      <button
        type="button"
        class="user-menu-trigger"
        [attr.aria-expanded]="userMenuOpen"
        (click)="toggleUserMenu()"
      >
        <fa-icon [icon]="faUserCircle"></fa-icon>

        <div class="small text-start min-w-0">
          <div class="fw-semibold">{{ currentUser.name }}</div>
          <div class="text-muted">{{ currentUser.email }}</div>
        </div>

        <fa-icon class="ms-auto user-menu-chevron" [icon]="faChevronUp"></fa-icon>
      </button>
    </div>
  </aside>
}

<app-project-wizard-navigation
  [steps]="steps"
  [currentStepIndex]="currentStepIndex"
  [maxAllowedStepIndex]="maxAllowedStepIndex"
  [isLastStep]="isLastStep"
  (stepSelected)="goToStep($event)"
  (previous)="previousStep()"
  (next)="nextStep()"
  (finished)="finish()"
>
  @switch (currentStep.key) {
    @case ('project') {
      <app-project-wizard-project-step />
    }

    @case ('personas') {
      <app-project-wizard-personas-step />
    }

    @case ('scenarios') {
      <app-project-wizard-scenarios-step [initialPersonaIndex]="initialPersonaIndex" />
    }

    @case ('userStories') {
      <app-project-wizard-user-stories-step [initialScenarioIndex]="initialScenarioIndex" />
    }
  }
</app-project-wizard-navigation>

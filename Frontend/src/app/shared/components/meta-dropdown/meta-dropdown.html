<div ngbDropdown class="meta-dropdown">
  <button
    [id]="id"
    type="button"
    class="meta-control meta-dropdown-toggle"
    [class.is-invalid]="invalid"
    [disabled]="disabled || options.length === 0"
    ngbDropdownToggle
  >
    @if (selectedOption?.colorClass) {
      <span [class]="'stage-dot ' + selectedOption?.colorClass"></span>
    }
    <span class="text-truncate">{{ selectedOption?.label ?? placeholder }}</span>
  </button>

  <div ngbDropdownMenu [attr.aria-labelledby]="id" class="meta-dropdown-menu">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="dropdown-item meta-dropdown-option"
        [class.active]="option.value === value"
        ngbDropdownItem
        (click)="selectOption(option)"
      >
        @if (option.colorClass) {
          <span [class]="'stage-dot ' + option.colorClass"></span>
        }
        <span class="text-truncate">{{ option.label }}</span>
      </button>
    }
  </div>
</div>

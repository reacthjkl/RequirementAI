<div class="row justify-content-between mb-5">
  <div class="col-auto">
    <h3>Projects</h3>
  </div>

  <div class="col-auto">
    <button class="btn btn-primary" [routerLink]="['/projects', 'wizard']">
      <fa-icon [icon]="faPlus"></fa-icon>
      New
    </button>
  </div>
</div>

@if (projects.length > 0) {
  <div class="list-group list-group-flush">
    @for (project of projects; track project.id) {
      <button
        type="button"
        class="list-group-item list-group-item-action project-list-item"
        (click)="openProject(project)"
      >
        <span>{{ project.name }}</span>
        <app-project-status [status]="project.status" />
      </button>
    }
  </div>
} @else {
  <div class="text-secondary">There are no projects yet</div>
}

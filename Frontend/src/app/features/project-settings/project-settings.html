<div class="d-flex flex-column gap-4">
  <div>
    <h3>Settings</h3>
  </div>

  @if (loading) {
    <div class="text-muted">Loading settings...</div>
  } @else if (!project) {
    <div class="text-secondary">Project not found</div>
  } @else {
    <section class="card border-0 shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">Project details</h5>

        <form [formGroup]="form" class="d-flex flex-column gap-3" (ngSubmit)="saveProject()">
          <div>
            <label for="projectName" class="form-label">Project name</label>
            <input
              id="projectName"
              type="text"
              class="form-control"
              [class.is-invalid]="isInvalid('name')"
              formControlName="name"
            />
            @if (isInvalid('name')) {
              <div class="invalid-feedback">Project name is required.</div>
            }
          </div>

          <div>
            <label for="projectDescription" class="form-label">Description</label>
            <textarea
              id="projectDescription"
              class="form-control"
              [class.is-invalid]="isInvalid('description')"
              rows="4"
              formControlName="description"
            ></textarea>
            @if (isInvalid('description')) {
              <div class="invalid-feedback">Description is required.</div>
            }
          </div>

          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary" [disabled]="saving">
              <fa-icon [icon]="faFloppyDisk"></fa-icon>
              {{ saving ? 'Saving...' : 'Save changes' }}
            </button>
          </div>
        </form>
      </div>
    </section>

    <section class="card border-danger shadow-sm">
      <div class="card-body">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
          <div>
            <h5 class="card-title text-danger mb-1">Danger zone</h5>
            <p class="card-text text-secondary mb-0">
              Delete this project and all related data permanently.
            </p>
          </div>

          <button
            type="button"
            class="btn btn-danger flex-shrink-0"
            [disabled]="deleting"
            (click)="deleteProject()"
          >
            <fa-icon [icon]="faTrash"></fa-icon>
            {{ deleting ? 'Deleting...' : 'Delete project' }}
          </button>
        </div>
      </div>
    </section>
  }
</div>

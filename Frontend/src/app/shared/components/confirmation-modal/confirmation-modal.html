<div class="modal-header">
  <h5 class="modal-title">{{ title }}</h5>
  <button
    type="button"
    class="btn-close"
    [attr.aria-label]="cancelText"
    (click)="activeModal.dismiss(false)"
  ></button>
</div>

<div class="modal-body">
  <p [class.mb-0]="!requiredConfirmationText">{{ message }}</p>

  @if (requiredConfirmationText) {
    <div class="alert alert-danger py-2" role="alert">
      This action is permanent. Type <strong>{{ requiredConfirmationText }}</strong> to confirm.
    </div>

    <label for="confirmationText" class="form-label">{{ confirmationLabel }}</label>
    <input
      id="confirmationText"
      type="text"
      class="form-control"
      autocomplete="off"
      [(ngModel)]="confirmationText"
    />
  }
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss(false)">
    {{ cancelText }}
  </button>
  <button
    type="button"
    class="btn {{ confirmButtonClass }}"
    [disabled]="!canConfirm"
    (click)="activeModal.close(true)"
  >
    {{ confirmText }}
  </button>
</div>

@if (loading()) {
  <app-global-spinner />
}

<div class="vh-100 d-flex flex-column">
  @if (loggedIn()) {
    <app-navbar />
  }

  <div class="row g-0 flex-grow-1 overflow-hidden">
    <!-- Menu -->
    @if (loggedIn()) {
      <div class="col-auto"><app-menu></app-menu>x</div>
    }

    <!-- Content -->
    <main class="col overflow-auto">
      <div class="container p-5">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

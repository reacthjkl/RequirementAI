<div class="row justify-content-between align-items-center g-3 mb-5">
  <div class="col-auto">
    <h3>Projects</h3>
  </div>

  <div class="col-auto d-flex align-items-center gap-2">
    <button class="btn btn-primary" [routerLink]="['/projects', 'wizard']">
      <fa-icon [icon]="faPlus"></fa-icon>
      New
    </button>
  </div>
</div>

<div class="row justify-content-between mb-3">
  <div class="col-auto">{{ projects.length }} Projects</div>

  <div class="col-auto">
    <div class="btn-group" role="group" aria-label="Project view">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        [class.active]="viewMode === 'list'"
        [attr.aria-pressed]="viewMode === 'list'"
        (click)="setViewMode('list')"
      >
        <fa-icon [icon]="faList"></fa-icon>
      </button>

      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        [class.active]="viewMode === 'cards'"
        [attr.aria-pressed]="viewMode === 'cards'"
        (click)="setViewMode('cards')"
      >
        <fa-icon [icon]="faGrip"></fa-icon>
      </button>
    </div>
  </div>
</div>

@if (projects.length > 0) {
  @if (viewMode === 'list') {
    <div class="card border-0 shadow-sm">
      <div class="list-group list-group-flush">
        @for (project of projects; track project.id) {
          <button
            type="button"
            class="list-group-item list-group-item-action py-3"
            (click)="openProject(project)"
          >
            <span class="row align-items-center g-3">
              <span class="col-auto">
                <span
                  class="rounded bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center p-2"
                >
                  <fa-icon [icon]="faFolderOpen"></fa-icon>
                </span>
              </span>

              <span class="col overflow-hidden text-start">
                <span class="d-block fw-semibold text-truncate">{{ project.name }}</span>
                <span class="d-block small text-secondary text-truncate">
                  {{ project.description }}
                </span>
              </span>

              <span class="col-auto">
                <app-project-status
                  [status]="project.status"
                  [refinementStatus]="project.refinementStatus"
                />
              </span>
            </span>
          </button>
        }
      </div>
    </div>
  } @else {
    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">
      @for (project of projects; track project.id) {
        <div class="col">
          <button
            type="button"
            class="card h-100 w-100 text-start shadow-sm"
            (click)="openProject(project)"
          >
            <div class="card-body d-flex flex-column gap-3">
              <div class="d-flex align-items-start justify-content-between gap-3 overflow-hidden">
                <h5 class="card-title mb-0 text-truncate flex-grow-1 overflow-hidden">
                  {{ project.name }}
                </h5>
                <app-project-status
                  class="flex-shrink-0"
                  [status]="project.status"
                  [refinementStatus]="project.refinementStatus"
                />
              </div>

              <p class="card-text text-secondary mb-0 text-truncate">
                {{ project.description }}
              </p>
            </div>
          </button>
        </div>
      }
    </div>
  }
} @else {
  <div class="text-secondary">There are no projects yet</div>
}
